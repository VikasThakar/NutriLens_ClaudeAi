; Loaded as conf.d/zz-nutrilens.ini so it wins over the image defaults.

; Phone photos exceed PHP's 2M default routinely; post_max_size has to leave
; room for the image plus the form fields around it. Kept in step with
; client_max_body_size in docker/nginx.conf.
upload_max_filesize = 20M
post_max_size = 24M

; MealImagePreparer decodes a full-resolution JPEG into memory before it can
; downscale it, which 128M does not cover for a 12-megapixel photo.
memory_limit = 512M

; Must outlast AI_TIMEOUT (90s) so PHP is not killed mid-analysis.
max_execution_time = 120

expose_php = Off

; Laravel is thousands of file reads per request without a compile cache.
; validate_timestamps=0 is safe here precisely because the code is baked into
; an immutable image — nothing changes under a running container.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
