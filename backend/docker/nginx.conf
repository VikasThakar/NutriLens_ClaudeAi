# Template, not the live config. docker/entrypoint.sh runs envsubst over it to
# fill in ${PORT} and writes the result to /etc/nginx/nginx.conf. envsubst is
# restricted to that one name so nginx's own $uri / $query_string survive.

user                 www-data;
worker_processes     auto;
pid                  /run/nginx.pid;
error_log            /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include           /etc/nginx/mime.types;
    default_type      application/octet-stream;

    # Railway collects stdout/stderr as deploy logs. A file inside a disposable
    # container would just hide them.
    access_log        /dev/stdout;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;
    server_tokens     off;

    # Meal photos come straight off a phone camera and routinely pass nginx's
    # 1m default. Kept in step with upload_max_filesize in docker/php.ini.
    client_max_body_size 20m;

    gzip              on;
    gzip_types        text/plain text/css application/json application/javascript;

    server {
        listen      ${PORT} default_server;
        server_name _;
        root        /app/public;
        index       index.php;
        charset     utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass  127.0.0.1:9000;
            fastcgi_index index.php;
            include       fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

            # A vision call is allowed AI_TIMEOUT (90s) to answer. nginx's 60s
            # default would drop the connection first and surface a real
            # analysis as a 504.
            fastcgi_read_timeout 120s;
        }

        # Never serve dotfiles — .env above all.
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
